<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Delera-AgentCRM architecture</title>
  <desc id="desc">The user defines scope and approval. Their host agent works with a local SQLite CRM and separately verified personal connectors. External effects require approval. No background MCP bridge is bundled.</desc>
  <defs><linearGradient id="surface" x1="0" y1="0" x2="1200" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f5f7"/></linearGradient><linearGradient id="accent" x1="350" y1="125" x2="650" y2="335" gradientUnits="userSpaceOnUse"><stop stop-color="#f23b97"/><stop offset="1" stop-color="#e10070"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="450" rx="20" fill="url(#surface)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="53" fill="#e10070" font-size="14" font-weight="700" letter-spacing="2">A CLEAR BOUNDARY BETWEEN PLANNING AND ACTING</text>
    <g fill="none" stroke="#e10070" stroke-width="2"><path d="M260 230h90M650 230h78V150h72M728 230v106h72"/><path d="m340 225 10 5-10 5m440-85 10 5-10 5m0 176 10 5-10 5"/></g>
    <g filter="url(#shadow)"><rect x="40" y="168" width="220" height="124" rx="14" fill="#ffffff" stroke="#e6e6e8"/><text x="66" y="210" font-size="24" fill="#141414">You set the scope.</text><text x="66" y="248" font-size="16" fill="#666666">Identity · policy · consent</text>
      <rect x="350" y="125" width="300" height="210" rx="16" fill="url(#accent)"/><text x="377" y="166" font-size="13" font-weight="700" letter-spacing="2" fill="#fff1f8">YOUR AGENT SESSION</text><text x="377" y="216" font-size="29" font-weight="700" fill="#ffffff">Read. Plan. Review.</text><text x="377" y="258" font-size="17" fill="#ffe0ef">ChatGPT Work · Claude Cowork</text><text x="377" y="286" font-size="17" fill="#ffe0ef">or a compatible local agent</text>
      <rect x="800" y="92" width="355" height="121" rx="14" fill="#ffffff" stroke="#e6e6e8"/><text x="826" y="134" font-size="23" fill="#141414">Your local CRM</text><text x="826" y="171" font-size="16" fill="#666666">SQLite · contacts · pipeline · audit</text>
      <rect x="800" y="271" width="355" height="121" rx="14" fill="#ffffff" stroke="#e10070" stroke-opacity=".6" stroke-dasharray="6 5"/><text x="826" y="313" font-size="23" fill="#141414">Your personal connectors</text><text x="826" y="350" font-size="16" fill="#666666">Verify tools → request consent → act</text></g>
    <text x="41" y="419" font-size="14" fill="#666666">Preview boundary: no always-on runner or automatic host-MCP bridge is bundled.</text>
  </g>
</svg>
