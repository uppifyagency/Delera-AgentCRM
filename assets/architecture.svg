<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc"><title id="title">Delera-AgentCRM architecture</title><desc id="desc">The user defines scope and approval. Their host agent works with a local SQLite CRM and separately verified personal connectors. External effects require approval. No background MCP bridge is bundled.</desc><rect width="1200" height="450" rx="20" fill="#122019"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="53" fill="#b7c5b8" font-size="14" letter-spacing="2">A CLEAR BOUNDARY BETWEEN PLANNING AND ACTING</text><g fill="none" stroke="#82a268" stroke-width="2"><path d="M260 230h90M650 230h78V150h72M728 230v106h72"/><path d="m340 225 10 5-10 5m440-85 10 5-10 5m0 176 10 5-10 5"/></g><rect x="40" y="168" width="220" height="124" rx="14" fill="#203027" stroke="#415544"/><text x="66" y="210" font-size="24" fill="#f1f6ee">You set the scope.</text><text x="66" y="248" font-size="16" fill="#b7c5b8">Identity · policy · consent</text><rect x="350" y="125" width="300" height="210" rx="16" fill="#cbfb77"/><text x="377" y="166" font-size="13" letter-spacing="2" fill="#3e5330">YOUR AGENT SESSION</text><text x="377" y="216" font-size="29" font-weight="700" fill="#17241a">Read. Plan. Review.</text><text x="377" y="258" font-size="17" fill="#31462b">ChatGPT Work · Claude Cowork</text><text x="377" y="286" font-size="17" fill="#31462b">or a compatible local agent</text><rect x="800" y="92" width="355" height="121" rx="14" fill="#203027" stroke="#415544"/><text x="826" y="134" font-size="23" fill="#f1f6ee">Your local CRM</text><text x="826" y="171" font-size="16" fill="#b7c5b8">SQLite · contacts · pipeline · audit</text><rect x="800" y="271" width="355" height="121" rx="14" fill="#203027" stroke="#82a268" stroke-dasharray="6 5"/><text x="826" y="313" font-size="23" fill="#f1f6ee">Your personal connectors</text><text x="826" y="350" font-size="16" fill="#b7c5b8">Verify tools → request consent → act</text><text x="41" y="419" font-size="14" fill="#b7c5b8">Preview boundary: no always-on runner or automatic host-MCP bridge is bundled.</text></g></svg>
