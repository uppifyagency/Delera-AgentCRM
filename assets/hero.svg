<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Delera-AgentCRM — Più chiarezza, più prossime azioni</title>
  <desc id="desc">A light Delera landing hero with a pink accent and a pipeline preview.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f5f7"/></linearGradient><linearGradient id="pink" x1="1120" y1="128" x2="1460" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#f23b97"/><stop offset="1" stop-color="#e10070"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity=".14"/></filter></defs>
